<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070914" />
  <title>Coming Soon</title>

  <style>
    :root {
      --bg: #070914;
      --cyan: #66f7ff;
      --purple: #a884ff;
      --text: #f4f6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 48%, #171b3b 0%, transparent 42%),
        radial-gradient(ellipse at 50% 100%, #10142a 0%, var(--bg) 65%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    /* Starfield */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -50%;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 21%, #fff 99%, transparent),
        radial-gradient(1px 1px at 42% 77%, #8dfaff 99%, transparent),
        radial-gradient(2px 2px at 73% 34%, #fff 99%, transparent),
        radial-gradient(1px 1px at 84% 68%, #bda8ff 99%, transparent),
        radial-gradient(1px 1px at 28% 53%, #fff 99%, transparent);
      background-size: 280px 240px;
      opacity: 0.48;
      animation: drift 70s linear infinite;
    }

    body::after {
      background-size: 390px 330px;
      opacity: 0.25;
      animation-duration: 110s;
      animation-direction: reverse;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: min(92vw, 760px);
      padding: 3rem 1rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1.4rem;
      color: var(--cyan);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.36em;
      text-transform: uppercase;
    }

    .portal {
      position: relative;
      width: clamp(180px, 38vw, 280px);
      aspect-ratio: 1;
      margin: 0 auto 2.3rem;
      display: grid;
      place-items: center;
    }

    .portal::before,
    .portal::after,
    .portal-inner {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(102, 247, 255, 0.55);
      border-radius: 50%;
      box-shadow:
        0 0 18px rgba(102, 247, 255, 0.3),
        inset 0 0 24px rgba(102, 247, 255, 0.12);
      animation: rotate 14s linear infinite;
    }

    .portal::before {
      border-color: rgba(168, 132, 255, 0.65);
      transform: scaleX(0.55) rotate(30deg);
      animation-duration: 10s;
      animation-direction: reverse;
    }

    .portal::after {
      inset: 18%;
      border-style: dashed;
      opacity: 0.65;
      animation-duration: 28s;
    }

    .portal-inner {
      inset: 29%;
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 34px rgba(102, 247, 255, 0.45);
      animation: breathe 3s ease-in-out infinite;
    }

    .core {
      width: 15%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      box-shadow:
        0 0 15px 5px var(--cyan),
        0 0 48px 18px rgba(168, 132, 255, 0.5);
      animation: pulse 2.4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5.6rem);
      line-height: 0.98;
      font-weight: 800;
      letter-spacing: -0.07em;
      text-shadow: 0 0 30px rgba(102, 247, 255, 0.18);
    }

    h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(244, 246, 255, 0.85);
      text-shadow: none;
    }

    .description {
      max-width: 430px;
      margin: 1.5rem auto 0;
      color: #aeb5d0;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 2.2rem;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(102, 247, 255, 0.25);
      border-radius: 999px;
      color: #dcecff;
      background: rgba(9, 15, 34, 0.62);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .scanline {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.12;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.12) 4px
      );
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      50% { transform: scale(1.12); opacity: 0.55; }
    }

    @keyframes pulse {
      50% { opacity: 0.55; transform: scale(0.88); }
    }

    @keyframes drift {
      to { transform: translate3d(8%, 6%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="scanline" aria-hidden="true"></div>

  <main class="page">
    <p class="eyebrow">A new world is forming</p>

    <div class="portal" aria-hidden="true">
      <div class="portal-inner"></div>
      <div class="core"></div>
    </div>

    <h1>COMING <span>SOON</span></h1>

    <p class="description">
      Something extraordinary is on its way.
      The countdown has begun.
    </p>

    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      Launch sequence in progress
    </div>
  </main>
</body>
</html>
